site_name: eu-tech-reg
site_description: "An open, structured map of EU technology regulation that points to the official sources. Not legal advice."
site_url: https://chipi.github.io/eu-tech-reg/
site_author: Marko Dragoljevic

repo_name: chipi/eu-tech-reg
repo_url: https://github.com/chipi/eu-tech-reg
edit_uri: edit/main/docs/

copyright: "Information, not legal advice — the official text and your counsel are what count. Independent project, not affiliated with the European Union. Records CC BY 4.0, code MIT."

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Concept:
    - Overview: concept/index.md
    - 00 — Introduction and glossary: concept/00-introduction.md
    - 01 — Vision: concept/01-vision.md
    - 02 — Project concept: concept/02-project-concept.md
    - 03 — Data catalog: concept/03-data-catalog.md
    - 04 — Architecture: concept/04-architecture.md
    - 05 — Design system: concept/05-design-system.md
  - Experience (UXS):
    - Overview: uxs/index.md
    - Information architecture: uxs/IA.md
    - UXS-000 — Shared tokens: uxs/UXS-000-shared-tokens.md
    - UXS-001 — The act page: uxs/UXS-001-act-page.md
    - UXS-002 — Your role across every act: uxs/UXS-002-role-view.md
    - UXS-003 — Search: uxs/UXS-003-search.md
    - UXS-004 — What your agent gets back: uxs/UXS-004-agent-answer.md
    - UXS-005 — Home: uxs/UXS-005-home.md
    - UXS-006 — The article page: uxs/UXS-006-article-page.md
    - UXS-007 — The timeline across acts: uxs/UXS-007-timeline.md
    - UXS-008 — The relation map: uxs/UXS-008-relation-map.md
    - UXS-009 — Coming from outside the EU: uxs/UXS-009-coming-from-outside.md
    - UXS-010 — The re-reading queue: uxs/UXS-010-re-reading-queue.md
    - UXS-011 — For agents: uxs/UXS-011-for-agents.md
    - UXS-012 — Worked examples: uxs/UXS-012-worked-examples.md
    - UXS-013 — Synthesized reads and the matrix: uxs/UXS-013-synthesized-reads.md
  - User guide:
    - Overview: guide/index.md
    - 00 — Introduction: guide/GUIDE-00-introduction.md
    - 01 — What EU Tech Reg is: guide/GUIDE-01-what-eu-tech-reg-is.md
    - 02 — Reading an act: guide/GUIDE-02-reading-an-act.md
    - 03 — Your role across every act: guide/GUIDE-03-your-role-across-acts.md
    - 04 — Searching: guide/GUIDE-04-searching.md
    - 05 — Connecting your agent: guide/GUIDE-05-connecting-your-agent.md
    - 06 — Citations, states and gaps: guide/GUIDE-06-citations-states-and-gaps.md
  - Requirements (PRD):
    - Overview: prd/index.md
  - Proposals (RFC):
    - Overview: rfc/index.md
  - Decisions (ADR):
    - Overview: adr/index.md
  - In progress:
    - Overview: wip/index.md
    - The idea: wip/IDEA.md
    - Candidate scope: wip/SCOPE.md
    - Inputs for 04: wip/ARCHITECTURE-INPUTS.md
    - Figures: wip/FIGURES.md
  - History:
    - Overview: history/index.md

not_in_nav: |
  */*_TEMPLATE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chipi/eu-tech-reg
